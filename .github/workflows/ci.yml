name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.stage }}
    strategy:
      fail-fast: false
      matrix:
        stage: [policy, formatting, static]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run check
        run: python3 tools/ci/verify.py ${{ matrix.stage }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ matrix.stage }}
          retention-days: 7
          if-no-files-found: error
          path: |
            target/ci/
            **/target/surefire-reports/
            **/target/ktlint/
            **/target/detekt/
            **/detekt/

  reactor:
    name: Reactor stages
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compile production and test sources
        id: compile
        run: python3 tools/ci/verify.py compile
      - name: Run unit tests
        run: python3 tools/ci/verify.py unit
      - name: Run PostgreSQL tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: python3 tools/ci/verify.py postgres
      - name: Package verified application
        run: python3 tools/ci/verify.py package
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reactor
          retention-days: 7
          if-no-files-found: error
          path: |
            target/ci/
            **/target/surefire-reports/

  # Preserve the existing required check name; skipped/cancelled prerequisites are not success.
  build:
    if: ${{ always() }}
    needs: [checks, reactor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require every verification job
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/verify.py gate
