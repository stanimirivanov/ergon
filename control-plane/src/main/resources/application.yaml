spring:
  application:
    name: ergon-control-plane
  datasource:
    url: ${ERGON_DATABASE_URL}
    username: ${ERGON_DATABASE_USERNAME}
    password: ${ERGON_DATABASE_PASSWORD}
  flyway:
    table: ergon_flyway_schema_history
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ERGON_HUMAN_JWT_ISSUER_URI:}

ergon:
  contract-promotion:
    enforced-tenants: ${ERGON_CONTRACT_PROMOTION_ENFORCED_TENANTS:}
  run-supervision:
    control:
      enabled: ${ERGON_RUN_CONTROL_ENABLED:false}
    cancellation:
      enabled: ${ERGON_RUN_SUPERVISOR_CANCELLATION_ENABLED:false}
    escalation:
      enabled: ${ERGON_RUN_SUPERVISOR_ESCALATION_ENABLED:false}
    retry:
      enabled: ${ERGON_RUN_SUPERVISOR_RETRY_ENABLED:false}
    execution:
      enabled: ${ERGON_RUN_SUPERVISOR_EXECUTION_ENABLED:false}
    proof-finalization:
      enabled: ${ERGON_RUN_PROOF_FINALIZATION_ENABLED:false}
    approval:
      enabled: ${ERGON_RUN_SUPERVISOR_APPROVAL_ENABLED:false}
    handover:
      enabled: ${ERGON_RUN_SUPERVISOR_HANDOVER_ENABLED:false}
  follow-up:
    release-enabled: ${ERGON_HUMAN_FOLLOW_UP_RELEASE_ENABLED:false}
    handover-enabled: ${ERGON_HUMAN_FOLLOW_UP_HANDOVER_ENABLED:false}
    completion-enabled: ${ERGON_HUMAN_FOLLOW_UP_COMPLETION_ENABLED:false}
    priority-enabled: ${ERGON_HUMAN_FOLLOW_UP_PRIORITY_ENABLED:false}
  security:
    browser-session:
      enabled: ${ERGON_BROWSER_SESSION_ENABLED:false}
      audience: ${ERGON_BROWSER_SESSION_AUDIENCE:workbench}
    human-jwt:
      identity-provider: ${ERGON_HUMAN_IDENTITY_PROVIDER:}

server:
  port: 8090
  servlet:
    session:
      timeout: 30m
      cookie:
        name: __Host-Http-Ergon-Session
        http-only: true
        secure: true
        # OAuth redirects are cross-site top-level navigations; Strict would drop the initiating session.
        same-site: lax
        path: /
