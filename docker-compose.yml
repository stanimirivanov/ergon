# Local infrastructure for Ergon applications run natively on the host.
# The observability stack is deliberately deferred to milestone M08.
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: rag_help_center
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_help_center"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
